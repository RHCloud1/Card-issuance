name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run application and backup regression tests
        run: python -m unittest discover -s tests -v
      - name: Check deployment script syntax
        if: matrix.python-version == '3.12'
        run: |
          for script in scripts/*.sh tests/scripts/deployment_scripts_test.sh; do
            bash -n "$script"
          done
      - name: Run deployment script regression tests
        if: matrix.python-version == '3.12'
        run: bash tests/scripts/deployment_scripts_test.sh
